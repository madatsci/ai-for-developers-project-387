# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

services:
  - type: web
    name: calendar-of-calls-387
    runtime: docker
    plan: free
    region: frankfurt
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        fromDatabase:
          name: calendar-of-calls-387-db
          property: connectionString

databases:
  - name: calendar-of-calls-387-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
    databaseName: calendar
    user: calendar
    ipAllowList: []
