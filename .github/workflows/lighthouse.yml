name: Lighthouse

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lhci:
    name: Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Install compatible Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: 137
      - name: Run Lighthouse CI
        run: |
          test -n "$APP_URL" || { echo "Configure the APP_URL repository variable" >&2; exit 1; }
          npm install --global @lhci/cli@0.15.x
          lhci autorun
        env:
          APP_URL: ${{ vars.APP_URL }}
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
